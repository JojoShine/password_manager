name: Lockora signed release candidate

on:
  push:
    tags: ['v*', 'lockora-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish verified candidate to OSS and promote stable feeds'
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
    secrets:
      LOCKORA_MACOS_PRIVATE_KEY:
        required: true
      LOCKORA_WINDOWS_PRIVATE_KEY:
        required: true
      OSS_ACCESS_KEY_ID:
        required: false
      OSS_ACCESS_KEY_SECRET:
        required: false
      OSS_SECURITY_TOKEN:
        required: false

permissions:
  contents: read

# A release promotion must never race another candidate/promotion.
concurrency:
  group: lockora-stable-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements-release.txt
      - name: Release tooling tests
        run: python -m unittest discover -s tools/tests -v
      - name: Validate version, notes and public configuration
        id: version
        shell: bash
        run: |
          tag_arg=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag_arg=(--tag "$GITHUB_REF_NAME"); fi
          full=$(python tools/release.py validate "${tag_arg[@]}")
          echo "version=${full%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${full#*+}" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: flutter pub get
      - run: flutter test

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-14
          - platform: windows
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements-release.txt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
      - run: flutter pub get
      - name: Native PBKDF2 compatibility and unlock latency
        run: flutter test test/vault_kdf_test.dart
      - run: python tools/release.py configure
      - name: Build desktop application
        shell: bash
        run: |
          if ! flutter build ${{ matrix.platform }} --release --dart-define-from-file=build/updates.json --verbose > build/desktop-build.log 2>&1; then
            tail -n 200 build/desktop-build.log
            exit 1
          fi
      - name: Native migration and installer authorization tests
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          python tools/test_native_migration.py
          python tools/test_windows_install_authorization.py
          python tools/test_sparkle_runtime.py build/macos/Build/Products/Release/Lockora.app
      - name: Package macOS archive preserving links and executable modes
        if: matrix.platform == 'macos'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          app=build/macos/Build/Products/Release/Lockora.app
          test -d "$app"
          lipo "$app/Contents/MacOS/Lockora" -verify_arch arm64 x86_64
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/Lockora-${RELEASE_VERSION}-macos.zip"
          echo 'Platform Developer ID signing/notarization is not configured by this workflow.' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Windows runtime and create per-user installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_BUILD: ${{ needs.validate.outputs.build }}
        run: |
          $runtime = Resolve-Path 'build/windows/x64/runner/Release'
          $vswhere = 'C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw 'Visual C++ app-local runtime unavailable' }
          Copy-Item "$($crt.FullName)/*.dll" $runtime
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (!(Test-Path "$runtime/$dll")) { throw "Missing CRT: $dll" }
          }
          foreach ($file in @('Lockora.exe', 'flutter_windows.dll', 'WinSparkle.dll', 'data/flutter_assets/assets/files/password_manager_browser.zip')) {
            if (!(Test-Path "$runtime/$file")) { throw "Missing required runtime file: $file" }
          }
          $out = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force $out | Out-Null
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' "/DAppVersion=$env:RELEASE_VERSION" "/DBuildNumber=$env:RELEASE_BUILD" "/DSourceDir=$runtime" "/DOutputPath=$out" windows/installer/Lockora.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          'Platform Authenticode signing is not configured by this workflow.' >> $env:GITHUB_STEP_SUMMARY
      - name: Sign exact update archive with mandatory Ed25519 key
        shell: bash
        env:
          LOCKORA_MACOS_PRIVATE_KEY: ${{ secrets.LOCKORA_MACOS_PRIVATE_KEY }}
          LOCKORA_WINDOWS_PRIVATE_KEY: ${{ secrets.LOCKORA_WINDOWS_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          suffix=macos.zip
          if [[ "$PLATFORM" == windows ]]; then suffix=windows-setup.exe; fi
          python tools/release.py sign --platform "$PLATFORM" --package "dist/Lockora-${RELEASE_VERSION}-${suffix}"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  candidate:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements-release.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          merge-multiple: true
          path: dist
      - name: Include bundled browser extension
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: cp assets/files/password_manager_browser.zip "dist/Lockora-${RELEASE_VERSION}-browser.zip"
      - name: Verify both signatures and generate feeds, release notes and checksums
        run: python tools/release.py generate --directory dist
      - uses: actions/upload-artifact@v4
        with:
          name: lockora-${{ needs.validate.outputs.version }}-candidate
          path: dist/*
          if-no-files-found: error

  publish:
    if: inputs.publish == true
    needs: [validate, candidate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements-release.txt
      - uses: actions/download-artifact@v4
        with:
          name: lockora-${{ needs.validate.outputs.version }}-candidate
          path: dist
      - name: Verify immutable release objects then promote both feeds last
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_SECURITY_TOKEN: ${{ secrets.OSS_SECURITY_TOKEN }}
        run: python tools/release.py publish --directory dist
