name: Build Lockora candidate manually
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish signed candidate to OSS (otherwise retain CI artifacts only)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  candidate:
    uses: ./.github/workflows/build-release.yml
    with:
      publish: ${{ inputs.publish }}
    secrets: inherit
