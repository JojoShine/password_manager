# Included by the tbtparent.me HTTPS server.
location = /lockora {
    return 301 /lockora/$is_args$args;
}

location ^~ /lockora/ {
    root /srv/www;
    index index.html;
    try_files $uri $uri/ =404;
}

location = /password-manager {
    return 301 /lockora/$is_args$args;
}

location ^~ /password-manager/ {
    rewrite ^/password-manager/(.*)$ /lockora/$1 permanent;
}
